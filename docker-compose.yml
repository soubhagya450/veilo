version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: veilo-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - veilo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veilo-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=veilo-production-super-secret-key-32-chars-change-me
      - FRONTEND_ORIGIN=*
      - ROOM_TTL_SECONDS=1800
      - SESSION_TTL_SECONDS=3600
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - veilo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_SOCKET_URL=
    container_name: veilo-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - veilo-net

networks:
  veilo-net:
    driver: bridge
