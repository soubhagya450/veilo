<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Cyan to Blue Gradient for First Bubble -->
    <linearGradient id="blueBubbleGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#00EAFF"/>
      <stop offset="35%" stop-color="#00A2FF"/>
      <stop offset="100%" stop-color="#005BFF"/>
    </linearGradient>

    <!-- Deep Violet to Magenta/Pink Gradient for Second Bubble -->
    <linearGradient id="purpleBubbleGrad" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#5B08FF"/>
      <stop offset="45%" stop-color="#9E15F2"/>
      <stop offset="100%" stop-color="#F9249E"/>
    </linearGradient>

    <!-- Translucent Glossy Glass Ribbon Overlay -->
    <linearGradient id="glassRibbonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#7AE9FF" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#C26BFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Ambient Dropshadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0072FF" flood-opacity="0.25"/>
    </filter>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#E01498" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Purple/Magenta Speech Bubble (Bottom Right) -->
  <g filter="url(#purpleGlow)">
    <path d="M260 215 C260 160 305 130 360 130 C418 130 460 170 460 225 C460 280 415 320 358 320 C340 320 320 315 305 308 L265 325 C260 327 255 322 258 316 L265 292 C262 280 260 268 260 255 Z"
          fill="url(#purpleBubbleGrad)"/>
  </g>

  <!-- Blue/Cyan Speech Bubble (Top Left) -->
  <g filter="url(#softGlow)">
    <path d="M120 200 C120 125 175 75 255 75 C335 75 390 125 390 200 C390 270 338 318 260 318 C242 318 226 314 212 308 L155 330 C146 333 138 325 142 316 L152 284 C132 262 120 233 120 200 Z"
          fill="url(#blueBubbleGrad)"/>
  </g>

  <!-- Translucent Glass Ribbon Overlap Effect -->
  <path d="M310 102 C355 130 380 170 375 215 C370 260 330 295 285 308 C265 298 250 280 255 250 C262 205 295 160 310 102 Z"
        fill="url(#glassRibbonGrad)" style="mix-blend-mode: overlay; opacity: 0.85;"/>

  <path d="M280 140 C325 175 345 220 335 260 C325 295 295 315 268 312 C285 285 305 240 295 200 C288 175 272 155 280 140 Z"
        fill="#FFFFFF" opacity="0.35"/>

  <!-- Three Conversation Dots (...) inside Cyan Bubble -->
  <g fill="#FFFFFF">
    <circle cx="195" cy="195" r="14" />
    <circle cx="245" cy="195" r="14" />
    <circle cx="295" cy="195" r="14" />
  </g>
</svg>
